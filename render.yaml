services:
  - type: web
    name: mihnati
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && cd server && npm install && node seed.js
    startCommand: node server/index.js
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22.11.0
      - key: DEV_OTP
        value: "1"
    disk:
      name: mihnati-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
