services:
  - type: web
    name: mihnati
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: node server/seed.js && node server/index.js
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22.11.0
      - key: DEV_OTP
        value: "1"
# ملاحظة: الخطة المجانية بلا قرص دائم — قاعدة البيانات تُعاد بناؤها عند كل نشر.
# للترقية: plan: starter + disk (mountPath /var/data) + DATA_DIR=/var/data
