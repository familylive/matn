services:
  - type: web
    name: mihnati
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: node server/seed.js && node server/index.js
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22.11.0
      - key: DEV_OTP
        value: "1"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: mihnati-data
      mountPath: /var/data
      sizeGB: 1
